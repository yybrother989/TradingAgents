# Fly.io configuration for TradingAgents API
# Generated with: fly launch

app = "tradingagents-api"
primary_region = "sjc"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"
  TRADINGAGENTS_HOST = "0.0.0.0"
  TRADINGAGENTS_PORT = "8080"
  TRADINGAGENTS_DEBUG = "false"

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/v1/health"

# Build command
[build.args]
  PYTHON_VERSION = "3.11"

# Health checks
[deploy]
  release_command = ""
  strategy = "immediate"

